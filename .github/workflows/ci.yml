name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # Set up Node.js
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Enable and set up pnpm package manager
      - uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      # Get pnpm store directory for fast caching
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # Cache pnpm modules
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Start Nx Cloud CI run (using pnpm dlx or pnpm exec)
      - run: pnpm dlx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      # Install dependencies with pnpm
      - run: pnpm install --frozen-lockfile

      # Run tasks using pnpm nx
      - run: pnpm nx record -- pnpm nx format:check --base="remotes/origin/main"
      - run: pnpm nx run-many -t lint test build typecheck e2e
      
      # Nx Cloud self-healing CI
      - run: pnpm nx fix-ci
        if: always()
