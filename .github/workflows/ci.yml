name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # 1. Install pnpm first so it is available for Nx and dependency installation
      - uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      # 2. Setup Node.js with pnpm caching
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      # 3. Enable task distribution via Nx Cloud (run before dependencies are installed)
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      # 4. Install dependencies using pnpm
      - run: pnpm install --frozen-lockfile

      # 5. Run your Nx tasks
      - run: npx nx record -- npx nx format:check --base="remotes/origin/main"
      - run: npx nx run-many -t lint test build typecheck e2e
      
      # 6. Self-healing CI fixes
      - run: npx nx fix-ci
        if: always()